    <radialGradient id="coral"><stop offset="0" stop-color="#ff9690"/><stop offset=".45" stop-color="#ff9690" stop-opacity=".8"/><stop offset="1" stop-color="#ff9690" stop-opacity="0"/></radialGradient>
